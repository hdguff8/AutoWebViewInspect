<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未发现调试页面</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #d4d4d4;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #252526;
            border-radius: 12px;
            border: 1px solid #3c3c3c;
            max-width: 500px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            color: #aaaaaa;
        }
        .hint-list {
            text-align: left;
            margin-top: 30px;
            padding-left: 20px;
            display: inline-block;
        }
        .hint-list li {
            margin-bottom: 10px;
            font-size: 14px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #e8e8ed;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 20px;
            color: #515154;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔍</div>
        <h1>当前没有可调试的页面</h1>
        <p>程序正在后台持续扫描，请确保您的设备已正确连接并开启了调试模式。</p>
        
        <ul class="hint-list">
            <li>检查手机是否已通过 USB 连接并开启了 <b>USB 调试</b></li>
            <li>确保 App 已打开且包含处于活动状态的 <b>WebView</b></li>
            <li>确认 App 代码中开启了 <code>setWebContentsDebuggingEnabled(true)</code></li>
            <li>如果弹出“允许 USB 调试”授权框，请点击<b>确定</b></li>
            <li style="color: #e6a23c;">若长时间未发现设备，请切换到左侧<b>【调试】</b>面板，点击<b>“重启 ADB”</b>按钮</li>
        </ul>

        <div class="status-badge">正在自动同步中...</div>
    </div>
</body>
</html>
